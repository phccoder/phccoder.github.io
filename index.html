    --text: #e6e9f5;
    --muted: #9aa4c4;
    --accent: #6c8cff;
    --accent-2: #38d9ff;
    --accent-3: #8f6cff;
    --green: #34d399;
    --radius: 16px;

  * { margin: 0; padding: 0; box-sizing: border-box; }

    line-height: 1.6;
    -webkit-font-smoothing: antialiased;

  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  .hero-brand { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent-2); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
  .hero-name { font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .hero-role { color: var(--accent); font-weight: 600; margin-top: 8px; font-size: clamp(15px, 2vw, 18px); }
  .hero-tagline { margin-top: 14px; font-style: italic; color: var(--muted); font-size: 15px; }

  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
